<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8D8D8D"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1600" fill="#FAFAFB"/>

  <!-- Title -->
  <text x="800" y="104" font-size="42" font-weight="700" fill="#1D1C1D" text-anchor="middle">How I use Claude to build Slack demo content</text>
  <text x="800" y="148" font-size="21" fill="#616061" text-anchor="middle">Plain English in  →  real content in Slack out</text>

  <!-- YOU -->
  <rect x="690" y="216" width="220" height="62" rx="14" fill="#EDE7F1" stroke="#4A154B" stroke-width="1.5"/>
  <text x="800" y="255" font-size="23" font-weight="700" fill="#4A154B" text-anchor="middle">YOU</text>

  <!-- arrow YOU -> Claude -->
  <line x1="800" y1="278" x2="800" y2="322" stroke="#8D8D8D" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="820" y="306" font-size="16" fill="#7A7A7A" text-anchor="start">a plain-English request</text>

  <!-- Claude Code (hero) -->
  <rect x="480" y="326" width="640" height="112" rx="20" fill="#4A154B"/>
  <text x="800" y="378" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">Claude Code</text>
  <text x="800" y="414" font-size="18" fill="#E8DEF0" text-anchor="middle">runs in your terminal — the brain + the hands</text>

  <!-- arrow Claude -> Toolkit -->
  <line x1="800" y1="438" x2="800" y2="482" stroke="#8D8D8D" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="820" y="466" font-size="16" fill="#7A7A7A" text-anchor="start">writes &amp; runs small Python scripts (and fixes them)</text>

  <!-- Toolkit folder -->
  <rect x="400" y="486" width="800" height="104" rx="18" fill="#FFFFFF" stroke="#C9C6CC" stroke-width="1.5"/>
  <text x="800" y="528" font-size="24" font-weight="700" fill="#1D1C1D" text-anchor="middle">The toolkit folder — on your Mac</text>
  <text x="800" y="562" font-size="17" fill="#616061" text-anchor="middle">Python scripts  ·  tokens.json (your keys)  ·  Block Kit card templates  ·  .venv</text>

  <!-- trunk + branch arrows -->
  <line x1="800" y1="590" x2="800" y2="720" stroke="#8D8D8D" stroke-width="2.2"/>
  <line x1="800" y1="720" x2="232" y2="854" stroke="#8D8D8D" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="800" y1="720" x2="610" y2="854" stroke="#8D8D8D" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="800" y1="720" x2="990" y2="854" stroke="#8D8D8D" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="800" y1="720" x2="1368" y2="854" stroke="#8D8D8D" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Endpoint: Slack -->
  <rect x="55" y="860" width="350" height="212" rx="18" fill="#F5EFF7" stroke="#E5E1E6" stroke-width="1.5"/>
  <text x="230" y="920" font-size="27" font-weight="700" fill="#4A154B" text-anchor="middle">Slack</text>
  <text x="230" y="968" font-size="16" fill="#4A4A4A" text-anchor="middle">post messages, files &amp;</text>
  <text x="230" y="994" font-size="16" fill="#4A4A4A" text-anchor="middle">app-style notification cards</text>
  <text x="230" y="1040" font-size="14" font-weight="600" fill="#4A154B" text-anchor="middle">direct API · your keys</text>

  <!-- Endpoint: Salesforce -->
  <rect x="435" y="860" width="350" height="212" rx="18" fill="#E8F6FD" stroke="#D3E9F2" stroke-width="1.5"/>
  <text x="610" y="920" font-size="27" font-weight="700" fill="#0176D3" text-anchor="middle">Salesforce</text>
  <text x="610" y="968" font-size="16" fill="#4A4A4A" text-anchor="middle">real deal &amp; account data</text>
  <text x="610" y="994" font-size="16" fill="#4A4A4A" text-anchor="middle">so the story stays authentic</text>
  <text x="610" y="1040" font-size="13" font-weight="600" fill="#0176D3" text-anchor="middle">MCP (live) · sf CLI (scripts)</text>

  <!-- Endpoint: GitHub -->
  <rect x="815" y="860" width="350" height="212" rx="18" fill="#EEF0F3" stroke="#DDE0E4" stroke-width="1.5"/>
  <text x="990" y="920" font-size="27" font-weight="700" fill="#24292F" text-anchor="middle">GitHub</text>
  <text x="990" y="968" font-size="16" fill="#4A4A4A" text-anchor="middle">hosts app logos +</text>
  <text x="990" y="994" font-size="16" fill="#4A4A4A" text-anchor="middle">Block Kit card templates</text>
  <text x="990" y="1040" font-size="14" font-weight="600" fill="#24292F" text-anchor="middle">direct API</text>

  <!-- Endpoint: Any 3rd-party MCP server -->
  <rect x="1195" y="860" width="350" height="212" rx="18" fill="#FEF4E6" stroke="#F5E4C8" stroke-width="1.5"/>
  <text x="1370" y="920" font-size="22" font-weight="700" fill="#B45309" text-anchor="middle">Any 3rd-Party MCP Server</text>
  <text x="1370" y="968" font-size="16" fill="#4A4A4A" text-anchor="middle">e.g. Jira, ServiceNow, …</text>
  <text x="1370" y="994" font-size="16" fill="#4A4A4A" text-anchor="middle">real records to link to</text>
  <text x="1370" y="1040" font-size="14" font-weight="600" fill="#B45309" text-anchor="middle">via MCP server</text>

  <!-- legend -->
  <line x1="120" y1="1150" x2="1480" y2="1150" stroke="#E4E1E6" stroke-width="1.5"/>
  <text x="800" y="1210" font-size="19" font-weight="700" fill="#1D1C1D" text-anchor="middle">Two paths out</text>
  <text x="800" y="1248" font-size="17" fill="#5C5C5C" text-anchor="middle">Slack &amp; GitHub — reached through <tspan font-weight="700">direct API calls</tspan> using your saved keys</text>
  <text x="800" y="1278" font-size="17" fill="#5C5C5C" text-anchor="middle">Salesforce &amp; anything else — through an <tspan font-weight="700">MCP server</tspan> (live) or a <tspan font-weight="700">vendor CLI</tspan> like sf (scripts)</text>

  <text x="800" y="1360" font-size="18" fill="#7A7A7A" text-anchor="middle">The toolkit is just scripts that turn a request into API calls —</text>
  <text x="800" y="1388" font-size="18" fill="#7A7A7A" text-anchor="middle">Claude is the part that decides, builds, runs, and fixes.</text>

  <text x="1545" y="1560" font-size="13" fill="#B7B7B7" text-anchor="end">slack-demo-generator</text>
</svg>
